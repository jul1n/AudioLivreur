name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Debug - Env Info
        run: |
          python --version
          which ffmpeg
          ffmpeg -version
          ls -R assets/
        shell: bash

      - name: Prepare Binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path bin) { Remove-Item -Recurse -Force bin }
          New-Item -ItemType Directory -Force -Path bin
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobePath = (Get-Command ffprobe).Source
          Write-Host "Found FFmpeg at: $ffmpegPath"
          Copy-Item $ffmpegPath bin\ffmpeg.exe
          Copy-Item $ffprobePath bin\ffprobe.exe
          Get-ChildItem bin\
        shell: pwsh

      - name: Build Windows (Full & Light)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "Starting Build Light..."
          python -m PyInstaller --clean --noconfirm build_light.spec
          Write-Host "Starting Build Full..."
          python -m PyInstaller --clean --noconfirm build_full.spec
        shell: pwsh

      - name: Build macOS (Light)
        if: startsWith(matrix.os, 'macos')
        run: |
          python -m PyInstaller --clean --noconfirm build_light.spec
          cd dist
          zip -r AudioLivreur_mac.zip AudioLivreur.app
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
